name: share_intake
description: >-
  Local Android plugin for my_list: receives files and text shared from other
  apps (Excel/CSV/plain-text chat exports), queues them, and hands them to
  Dart via a method channel.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.8.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.mylist.share_intake
        pluginClass: ShareIntakePlugin
